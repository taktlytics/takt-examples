name: wordpress-e2e

# The WordPress example boots a real WP + WooCommerce stack (Docker via wp-env)
# and consumes the published Takt plugin release (taktlytics/takt-wordpress).
# Scoped to the `wordpress/**` path (plus this workflow) so the heavy Docker run
# only fires when the WordPress example changes; `workflow_dispatch` stays for
# manual reruns.
on:
  workflow_dispatch:
  push:
    paths:
      - 'wordpress/**'
      - '.github/workflows/wordpress-e2e.yml'
  pull_request:
    paths:
      - 'wordpress/**'
      - '.github/workflows/wordpress-e2e.yml'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: e2e (wordpress)
    defaults:
      run:
        working-directory: wordpress
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wordpress/package-lock.json
      - name: install
        run: npm ci
      - name: install playwright chromium
        run: npx playwright install --with-deps chromium
      - name: start WordPress + WooCommerce
        run: npm run env:start
      - name: configure the plugin
        run: npm run setup
      - name: run end-to-end tests
        run: npx playwright test
      - name: upload report on failure
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: playwright-report
          path: wordpress/playwright-report/
          retention-days: 7

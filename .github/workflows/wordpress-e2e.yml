name: wordpress-e2e

# The WordPress example boots a real WP + WooCommerce stack (Docker via wp-env)
# and consumes the published Takt plugin release (taktlytics/takt-wordpress).
# Scoped to the `wordpress/**` path (plus this workflow) so the heavy Docker run
# only fires when the WordPress example changes; `workflow_dispatch` stays for
# manual reruns.
on:
  workflow_dispatch:
  push:
    paths:
      - 'wordpress/**'
      - '.github/workflows/wordpress-e2e.yml'
  pull_request:
    paths:
      - 'wordpress/**'
      - '.github/workflows/wordpress-e2e.yml'

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: e2e (wordpress)
    defaults:
      run:
        working-directory: wordpress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: wordpress/package-lock.json
      - name: install
        run: npm ci
      - name: install playwright chromium
        run: npx playwright install --with-deps chromium
      - name: unit tests for the plugin fetch script
        run: npm run test:scripts
      - name: start WordPress + WooCommerce
        run: npm run env:start
      - name: configure the plugin
        run: npm run setup
      - name: run end-to-end tests
        run: npx playwright test
      - name: upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report
          path: wordpress/playwright-report/
          retention-days: 7

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [vanilla, react, vue, svelte, solid, angular, astro]
    name: build (${{ matrix.example }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.example }}/package-lock.json
      - name: install
        working-directory: ${{ matrix.example }}
        run: npm ci
      - name: build
        working-directory: ${{ matrix.example }}
        run: npm run build

  build-php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [php, laravel, symfony]
    name: build (${{ matrix.example }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.31.1
        with:
          php-version: '8.3'
          coverage: none
      - name: install
        working-directory: ${{ matrix.example }}
        run: composer install --no-interaction --no-progress
      - name: build
        working-directory: ${{ matrix.example }}
        run: composer run build

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [vanilla, react, vue, svelte, solid, angular, astro]
    name: build (${{ matrix.example }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.example }}/package-lock.json
      - name: install
        working-directory: ${{ matrix.example }}
        run: npm ci
      - name: build
        working-directory: ${{ matrix.example }}
        run: npm run build

  build-php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [php, laravel, symfony]
    name: build (${{ matrix.example }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.31.1
        with:
          php-version: '8.3'
          coverage: none
      - name: install
        working-directory: ${{ matrix.example }}
        run: composer install --no-interaction --no-progress
      - name: build
        working-directory: ${{ matrix.example }}
        run: composer run build

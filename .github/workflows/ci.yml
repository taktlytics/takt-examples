name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [vanilla, react, vue, svelte, solid, angular, astro]
    name: build (${{ matrix.example }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ${{ matrix.example }}/package-lock.json
      - name: install
        working-directory: ${{ matrix.example }}
        run: npm ci
      - name: build
        working-directory: ${{ matrix.example }}
        run: npm run build

  build-php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [php, laravel, symfony]
    name: build (${{ matrix.example }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          coverage: none
      - name: install
        working-directory: ${{ matrix.example }}
        run: composer install --no-interaction --no-progress
      - name: build
        working-directory: ${{ matrix.example }}
        run: composer run build

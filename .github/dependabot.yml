version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /vanilla
      - /react
      - /vue
      - /svelte
      - /solid
      - /angular
      - /astro
      - /wordpress
    schedule:
      interval: weekly
    groups:
      takt:
        patterns:
          - "@vskstudio/takt-*"
  - package-ecosystem: composer
    directories:
      - /php
      - /laravel
      - /symfony
    schedule:
      interval: weekly
    groups:
      takt:
        patterns:
          - "vskstudio/takt-*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
